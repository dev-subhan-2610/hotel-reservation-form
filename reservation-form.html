<html>
<head>
<style>
#a {
background-color: grey;
width: 800px;
height: 500px;
text-align: center;
padding: 10px;
}

form {
background-color: lightblue;
text-align: center;
}

th {
border: 2px solid;
width: 400px;
height: 30px;
}
</style>
</head>

<body>

<div id="a">

<h1 style="color: red;">Continental Hotel Reservation Form</h1>

<form>

<table>

<tr>
<th>Name</th>
<th colspan="2">
<input type="text" placeholder="Enter your name">
</th>
</tr>

<tr>
<th>Email</th>
<th colspan="2">
<input type="text" value="info@continental.pk">
</th>
</tr>

<tr>
<th>Mobile No.</th>
<th colspan="2">
<input type="number" placeholder="Enter your cell number">
</th>
</tr>

<tr>
<th>Arrival Time</th>
<th colspan="2">
<input type="text" placeholder="Enter arrival date">
</th>
</tr>

<tr>
<th>Departure</th>
<th colspan="2">
<input type="text" placeholder="Enter departure date">
</th>
</tr>

<tr>
<th>Room Type</th>
<th colspan="2">
<input type="radio" name="room">
<label>Single</label>

<input type="radio" name="room">
<label>Double</label>

<input type="radio" name="room">
<label>Presidential Suite</label>
</th>
</tr>

<tr>
<th>Preferences</th>
<th colspan="2">
<input type="checkbox">
<label>Non-Smoking</label>

<input type="checkbox">
<label>Internet</label>

<input type="checkbox">
<label>Firm Mattress</label>
</th>
</tr>

<tr>
<th>Mode of Payment</th>
<th colspan="2">
<input type="checkbox">
<label>Cash</label>

<input type="checkbox">
<label>Check</label>

<input type="checkbox">
<label>Credit Card</label>

<br><br>

<select>
<option>Select Card</option>
<option>Visa</option>
<option>Mastercard</option>
</select>
</th>
</tr>

<tr>
<th colspan="3">
<input type="button" value="Send Data">
</th>
</tr>

</table>

</form>
</div>

</body>
</html>
